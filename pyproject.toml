[tool.flet]
name = "FinSim"
display_name = "FinSim"
org = "com.maurieres.finsim"
description = "Application de simulation de placement financier."
version = "1.0.0"
author = "Bastien Maurieres"
icon = "assets/icon.png"
dependencies = ["requests"]

[tool.flet.android]
icon = "assets/icon.png"

# Google Play exige l'API 36 (Android 16) pour toute nouvelle application
# depuis le 31 aout 2026. Sans cette ligne le build heriterait du defaut de
# Flutter, soit 35, et l'AAB serait refuse a l'envoi.
target_sdk_version = 36

# Flet 0.86 ne sert plus les bibliotheques natives depuis le disque : minSdk 23
# est le plancher. Le build precedent etait a 21.
min_sdk_version = 23

[tool.flet.ios]
icon = "assets/icon.png"
launch_image = "assets/icon.png"